name: Continuous Release & Deploy to Render
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  release-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'goblinhub-api/package-lock.json'
      - run: chmod +x goblinhub-api/scripts/release/*.sh goblinhub-api/scripts/test/*.sh goblinhub-api/scripts/deploy/*.sh
      - name: Build
        working-directory: ./goblinhub-api
        run: ./scripts/release/build.sh
      - name: Test
        working-directory: ./goblinhub-api
        run: ./scripts/test/run_tests.sh
      - if: github.ref == 'refs/heads/main'
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d-%H%M%S')"
          git tag $TAG_NAME
          git push origin $TAG_NAME
  trigger-render-deploy:
    runs-on: ubuntu-latest
    needs: release-and-test
    if: github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x goblinhub-api/scripts/deploy/*.sh
      - name: Trigger Render Deploy Hook
        working-directory: ./goblinhub-api
        run: ./scripts/deploy/trigger_render.sh
      - name: Healthcheck
        working-directory: ./goblinhub-api
        run: ./scripts/deploy/healthcheck.sh
